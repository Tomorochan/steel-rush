name: Publish STEEL RUSH
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source project
        shell: bash
        run: |
          cat bundle/part_*.b64 | base64 --decode | tar -xJf -
          test -f build_assets.py
          test -f site/index.html
      - name: Apply 1.0 gameplay and interface patch
        shell: bash
        run: |
          cat updates/v1_0_part_*.b64 | base64 --decode | tar -xJf -
          printf '{"type":"module"}\n' > site/package.json
          node --version
          node site/tests/smoke_mechanics.mjs
      - name: Install 3D Tank Showroom 1.1
        shell: bash
        run: |
          cp updates/showroom.js site/src/showroom.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/src/main.js')
          src = p.read_text()
          assert "import {Game} from './game.js';" in src
          assert 'g.start();console.info' in src
          src = src.replace("import {Game} from './game.js';", "import {Game} from './game.js';\nimport {installShowroom} from './showroom.js';", 1)
          src = src.replace('g.start();console.info', 'installShowroom(g);g.start();console.info', 1)
          src = src.replace("version:'1.0.0'", "version:'1.1.0'")
          p.write_text(src)
          PY
          node --check site/src/showroom.js
          node --check site/src/main.js
      - name: Install race and practice modes 1.2
        shell: bash
        run: |
          cp updates/modes_1_2.js site/src/modes.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          src=p.read_text()
          assert "import {installShowroom} from './showroom.js';" in src
          assert 'installShowroom(g);g.start();console.info' in src
          src=src.replace("import {installShowroom} from './showroom.js';","import {installShowroom} from './showroom.js';\nimport {installModes} from './modes.js';",1)
          src=src.replace('installShowroom(g);g.start();console.info','installShowroom(g);installModes(g);g.start();console.info',1)
          src=src.replace("version:'1.1.0'","version:'1.2.0'")
          p.write_text(src)
          PY
          node --check site/src/modes.js
          node --check site/src/main.js
      - name: Install pre-race briefing 1.3
        shell: bash
        run: |
          cat updates/v1_3_part_*.b64 | base64 --decode | tar -xJf -
          node --check site/src/pregame.js
          node site/tests/smoke_pregame.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          src=p.read_text()
          assert "import {installModes} from './modes.js';" in src
          assert 'installShowroom(g);installModes(g);g.start();console.info' in src
          src=src.replace("import {installModes} from './modes.js';", "import {installModes} from './modes.js';\nimport {installPregame} from './pregame.js';",1)
          src=src.replace('installShowroom(g);installModes(g);g.start();console.info', 'installShowroom(g);installModes(g);installPregame(g);g.start();console.info',1)
          src=src.replace("version:'1.2.0'", "version:'1.3.0'",1)
          p.write_text(src)
          PY
          node --check site/src/main.js
      - name: Install cinematic start and fix unintended medal firing 1.4
        shell: bash
        run: |
          cp updates/intro_1_4.js site/src/intro.js
          cp updates/smoke_intro_1_4.mjs site/tests/smoke_intro_1_4.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/src/game.js')
          src=p.read_text(encoding='utf-8')
          old="window.addEventListener('mousedown',e=>{if((e.button===0||e.button===2)&&this.mode==='race'&&!e.target.closest?.('.power-slot'))this.combat?.useSelected(e.button===2);});"
          new="this.canvas.addEventListener('mousedown',e=>{if((e.button===0||e.button===2)&&this.mode==='race'&&this.combat?.inventory?.length)this.combat.useSelected(e.button===2);});"
          assert old in src, 'Expected old global firing handler'
          p.write_text(src.replace(old,new,1),encoding='utf-8')
          p=Path('site/src/main.js')
          src=p.read_text(encoding='utf-8')
          assert "import {installPregame} from './pregame.js';" in src
          assert 'installShowroom(g);installModes(g);installPregame(g);g.start();console.info' in src
          src=src.replace("import {installPregame} from './pregame.js';","import {installPregame} from './pregame.js';\nimport {installIntro} from './intro.js';",1)
          src=src.replace('installShowroom(g);installModes(g);installPregame(g);g.start();console.info',
                          'installShowroom(g);installModes(g);installPregame(g);installIntro(g);g.start();console.info',1)
          src=src.replace("version:'1.3.0'","version:'1.4.0'",1)
          p.write_text(src,encoding='utf-8')
          p=Path('site/index.html')
          src=p.read_text(encoding='utf-8')
          src,n=re.subn(r'(./src/main[.]js[?]v=)[0-9.]+',r'\g<1>1.4',src)
          assert n==1, 'Expected exactly one JS cache-buster'
          p.write_text(src,encoding='utf-8')
          PY
          node --check site/src/intro.js
          node --check site/src/game.js
          node --check site/src/main.js
          node site/tests/smoke_intro_1_4.mjs
      - name: Enable unrestricted weapons 1.5
        shell: bash
        run: |
          cp updates/freeweapons_1_5.js site/src/freeweapons.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          s=p.read_text(encoding='utf-8')
          assert "import {installIntro} from './intro.js';" in s
          assert "installIntro(g);g.start();" in s
          s=s.replace("import {installIntro} from './intro.js';", "import {installIntro} from './intro.js';\nimport {installFreeWeapons} from './freeweapons.js';",1)
          s=s.replace("installIntro(g);g.start();","installIntro(g);installFreeWeapons(g);g.start();",1)
          s=s.replace("version:'1.4.0'","version:'1.5.0'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('site/src/intro.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("СОБИРАЙ ЦВЕТНЫЕ МЕДАЛИ · ИСПОЛЬЗУЙ УСИЛЕНИЯ","ОРУЖИЕ ДОСТУПНО СРАЗУ · МЕДАЛИ — ДОПОЛНИТЕЛЬНО")
          s=s.replace("ПРОЕДЬ ЧЕРЕЗ ЦВЕТНУЮ МЕДАЛЬ, ЧТОБЫ ПОЛУЧИТЬ ОРУЖИЕ","1–3 — ВЫБРАТЬ ОРУЖИЕ · ЛКМ — АТАКА")
          s=s.replace("ОРУЖИЕ — ТОЛЬКО ПОСЛЕ ПОДБОРА ЦВЕТНОЙ МЕДАЛИ","ОРУЖИЕ ДОСТУПНО СРАЗУ · МЕДАЛИ НЕ ОБЯЗАТЕЛЬНЫ")
          s=s.replace("ПОЕХАЛИ! · ПОДБИРАЙ МЕДАЛИ ДЛЯ АТАК","ПОЕХАЛИ! · ОРУЖИЕ ГОТОВО · ЛКМ — ОГОНЬ")
          p.write_text(s,encoding='utf-8')
          p=Path('site/src/combat.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(!kind){if(this.g.now-this.messageThrottle>1.35){this.g.toast('СНАЧАЛА ПОДБЕРИТЕ МЕДАЛЬ');this.messageThrottle=this.g.now;}return false;}","if(!kind)return false;")
          s=s.replace("'НЕТ БОЕПРИПАСОВ'","'ОРУЖИЕ ГОТОВО'")
          p.write_text(s,encoding='utf-8')
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ПОДБЕРИТЕ МЕДАЛЬ, ЧТОБЫ СТРЕЛЯТЬ','МЕДАЛИ — ДОПОЛНИТЕЛЬНЫЕ УСИЛЕНИЯ')
          s=s.replace('НЕТ БОЕПРИПАСОВ','ОРУЖИЕ ГОТОВО')
          s=s.replace('1–3 / ЛКМ — МЕДАЛЬ','1–3 — ОРУЖИЕ · ЛКМ — АТАКА · F — МЕДАЛЬ')
          s=s.replace('1–3 / ЛКМ · применить медаль','1–3 · оружие · ЛКМ · стрелять · F · медаль')
          s=s.replace('1–3 / ЛКМ — медали','1–3 — оружие · ЛКМ — атака')
          s=s.replace('./src/main.js?v=1.4','./src/main.js?v=1.5')
          p.write_text(s,encoding='utf-8')
          Path('site/VERSION.txt').write_text('1.5.0 — Free Weapons / unlimited ammunition\n',encoding='utf-8')
          PY
          node --check site/src/freeweapons.js
          node --check site/src/main.js
          node --check site/src/intro.js
          node --check site/src/combat.js
      - name: Remove forced intro and start tips 1.6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/src/main.js')
          s=p.read_text(encoding='utf-8')
          assert s.count("import {installIntro} from './intro.js';")==1
          assert s.count('installIntro(g);')==1
          assert s.count('installFreeWeapons(g);g.start();')==1
          s=s.replace("import {installIntro} from './intro.js';",'',1)
          s=s.replace('installIntro(g);','',1)
          s=s.replace('installFreeWeapons(g);g.start();',"""installFreeWeapons(g);
            const launch=g.startRace.bind(g);
            g.startRace=(...args)=>{
              const savedToast=g.toast;
              g.toast=()=>{};
              try{launch(...args);}finally{g.toast=savedToast;}
              g.mode='race';
              g.fixedAcc=0;
              g.controls?.clear?.();
              g.mouseDx=0;g.mouseDy=0;
              g.toasted=0;
              const note=$('notice');
              if(note){note.textContent='';note.classList.remove('visible');}
            };
            g.start();""",1)
          s=s.replace("version:'1.5.0'","version:'1.6.0'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('site/src/game.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"window\.addEventListener\('blur',\(\)=>\{this\.controls\.clear\(\);if\(this\.mode==='race'\)this\.pause\(\)\}\)", "window.addEventListener('blur',()=>{this.controls.clear()})",s)
          assert n==1, 'Cannot find automatic blur/pause blocker'
          p.write_text(s,encoding='utf-8')
          p=Path('site/src/style.css')
          p.write_text(p.read_text(encoding='utf-8')+"\n/* 1.6: No tutorial hints over active gameplay */\n#game-ui .control-hints,#game-ui .sr15-title,#game-ui .power-heading #power-help{display:none!important}\n",encoding='utf-8')
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(\./src/main\.js\?v=)[0-9.]+',r'\g<1>1.6',s)
          assert n==1
          s=re.sub(r'(\./src/style\.css\?v=)[0-9.]+',r'\g<1>1.6',s)
          s=re.sub(r'<title>[^<]+</title>','<title>STEEL RUSH — Immediate Start 1.6</title>',s,count=1)
          p.write_text(s,encoding='utf-8')
          Path('site/VERSION.txt').write_text('1.6.0 — Immediate start / no forced intro or hints\n',encoding='utf-8')
          assert 'installIntro(g)' not in Path('site/src/main.js').read_text()
          assert 'g.startRace=(...args)' in Path('site/src/main.js').read_text()
          print('STEEL RUSH 1.6: immediate driving, no countdown, no start hints, no auto-pause')
          PY
          node --check site/src/main.js
          node --check site/src/game.js
          node site/tests/smoke_pregame.mjs
          node --check site/src/freeweapons.js
      - name: Install reliable start flow 1.7
        shell: bash
        run: |
          tar -xJf updates/startflow_1_7.tar.xz -C site
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/src/main.js')
          s=p.read_text(encoding='utf-8')
          assert "import {installFreeWeapons} from './freeweapons.js';" in s
          assert "version:'1.6.0'" in s
          assert s.count('g.start();')==1
          s=s.replace("import {installFreeWeapons} from './freeweapons.js';",
                      "import {installFreeWeapons} from './freeweapons.js';\nimport {installStartFlow} from './startflow.js';",1)
          s=s.replace('g.start();','installStartFlow(g);g.start();',1)
          s=s.replace("version:'1.6.0'","version:'1.7.0'",1)
          p.write_text(s,encoding='utf-8')
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(\./src/main\.js\?v=)[\d.]+',r'\g<1>1.7',s)
          assert n==1
          s=re.sub(r'(\./src/style\.css\?v=)[\d.]+',r'\g<1>1.7',s)
          s=re.sub(r'<title>[^<]+</title>','<title>STEEL RUSH 1.7 - Reliable Start</title>',s,count=1)
          p.write_text(s,encoding='utf-8')
          Path('site/VERSION.txt').write_text('1.7.0 - Race without forced blocking; optional cinematic\n',encoding='utf-8')
          PY
          node --check site/src/startflow.js
          node --check site/src/main.js
          node site/tests/smoke_startflow_1_7.mjs
      - name: Repair frozen race start 1.8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('site')
          p=root/'src/main.js';s=p.read_text(encoding='utf8')
          s,n=re.subn(r'\s*const launch=g\.startRace\.bind\(g\);.*?installStartFlow\(g\);g\.start\(\);','\n  installStartFlow(g);g.start();',s,count=1,flags=re.S)
          assert n==1,'conflicting 1.6 launch override missing'
          s=s.replace("version:'1.7.0'","version:'1.8.0'",1)
          assert "version:'1.8.0'" in s
          s=s.replace('mode:g.mode,track:','mode:g.mode,speed:g.tank.forward,time:g.time,lastError:g.lastLoopError||null,track:',1)
          s=s.replace('installStartFlow(g);g.start();',"installStartFlow(g);const logo=document.querySelector('.logotype small');if(logo)logo.textContent='DESERT CIRCUIT / 1.8';g.start();",1)
          p.write_text(s,encoding='utf8')
          p=root/'src/game.js';s=p.read_text(encoding='utf8')
          begin=s.find("this.toast(this.raceType==='practice'")
          if begin<0: begin=s.find("this.toast('НА СТАРТ!');this.resume();")
          assert begin>=0,'base start race message not found'
          end=s.index('this.resume();',begin)+len('this.resume();')
          s=s[:begin]+'/* StartFlow alone owns countdown; no start hints or pointer lock */'+s[end:]
          old="resume(){this.mode='race';$('pause').classList.add('hidden');this.canvas.requestPointerLock?.().catch(()=>{});}"
          assert old in s
          s=s.replace(old,"resume(){this.mode='race';$('pause').classList.add('hidden');this.canvas.focus?.({preventScroll:true});}",1)
          assert 'loop(t){const dt=' in s
          s=s.replace('loop(t){const dt=','loop(t){requestAnimationFrame(v=>this.loop(v));try{const dt=',1)
          old="   requestAnimationFrame(v=>this.loop(v));\n }\n toast(s)"
          assert old in s
          s=s.replace(old,"""  }catch(err){
               this.lastLoopError=(err?.stack||String(err)).slice(0,950);
               const now=performance.now();
               if(!this._lastLoopErrorAt||now-this._lastLoopErrorAt>2500){
                 this._lastLoopErrorAt=now;
                 console.error('[STEEL RUSH 1.8] Frame recovered instead of freezing:',err);
               }
               if(this.mode==='intro')this._sr17Installed?.skip?.();
             }
           }
           toast(s)""",1)
          p.write_text(s,encoding='utf8')
          p=root/'src/startflow.js';s=p.read_text(encoding='utf8')
          assert 'checkbox.checked=false;' in s
          s=s.replace('checkbox.checked=false;','checkbox.checked=true;',1)
          s=s.replace('Пролёт камеры перед стартом (необязательно)','Пролёт камеры перед стартом',1)
          p.write_text(s,encoding='utf8')
          p=root/'src/pregame.js';s=p.read_text(encoding='utf8')
          s,n=re.subn(r"game\.toast\?\.\(config\.type==='practice'.*?\);",'/* No start tutorial toast */',s,count=1)
          assert n==1
          p.write_text(s,encoding='utf8')
          p=root/'src/style.css';p.write_text(p.read_text(encoding='utf8')+"\n/* 1.8: no tutorial prompts during races */\n#game-ui #power-help,#game-ui #power-active,#game-ui #sr14-guide,#game-ui .control-hints,#game-ui .sr15-title{display:none!important;}\n",encoding='utf8')
          p=root/'index.html';s=p.read_text(encoding='utf8')
          s,n=re.subn(r'(\./src/main\.js\?v=)[0-9.]+',r'\g<1>1.8',s);assert n==1
          s=re.sub(r'(\./src/style\.css\?v=)[0-9.]+',r'\g<1>1.8',s)
          s=re.sub(r'<title>[^<]+</title>','<title>STEEL RUSH 1.8 - Race Start Fix</title>',s,count=1)
          p.write_text(s,encoding='utf8')
          (root/'VERSION.txt').write_text('1.8.0 - Clean cinematic to race transition, resilient frames\n',encoding='utf8')
          test=(root/'tests/smoke_startflow_1_7.mjs').read_text(encoding='utf8')
          old="assert.equal(api.toggle.checked,false);pass('cinematic is opt-in, disabled by default');"
          assert old in test
          test=test.replace(old,"assert.equal(api.toggle.checked,true);pass('cinematic is ON by default');\n api.toggle.checked=false;",1)
          (root/'tests/smoke_startflow_1_8.mjs').write_text(test,encoding='utf8')
          print('1.8 applied: flyover ON, clean HUD, no forced mouse capture, RAF fail-safe')
          
          PY
          node --check site/src/main.js
          node --check site/src/game.js
          node --check site/src/startflow.js
          node --check site/src/pregame.js
          node site/tests/smoke_startflow_1_8.mjs
      - name: Fix real HUD null-reference freeze 1.8.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/pregame.js')
          s=p.read_text(encoding='utf8')
          old="  $('race-mode-label').textContent="
          assert s.count(old)==1, 'Missing-label failure site must exist exactly once'
          s=s.replace(old,"  const modeLabel=$('race-mode-label');if(modeLabel)modeLabel.textContent=",1)
          p.write_text(s,encoding='utf8')
          p=Path('site/src/main.js')
          s=p.read_text(encoding='utf8')
          assert "version:'1.8.0'" in s
          s=s.replace("version:'1.8.0'","version:'1.8.1'",1)
          s=s.replace('DESERT CIRCUIT / 1.8','DESERT CIRCUIT / 1.8.1',1)
          p.write_text(s,encoding='utf8')
          p=Path('site/index.html')
          s=p.read_text(encoding='utf8')
          assert './src/main.js?v=1.8' in s
          s=s.replace('./src/main.js?v=1.8','./src/main.js?v=1.8.1',1)
          s=s.replace('./src/style.css?v=1.8','./src/style.css?v=1.8.1',1)
          s=s.replace('STEEL RUSH 1.8 - Race Start Fix','STEEL RUSH 1.8.1 - Race Start Fix',1)
          p.write_text(s,encoding='utf8')
          Path('site/VERSION.txt').write_text('1.8.1 - Fixed missing race-mode-label that halted the frame loop\n',encoding='utf8')
          assert "if(modeLabel)modeLabel.textContent=" in Path('site/src/pregame.js').read_text()
          print('HUD missing-element regression: PASS')
          PY
          node --check site/src/pregame.js
          node --check site/src/main.js
      - name: Restore compact HUD and control compatibility 1.9
        shell: bash
        run: |
          cat updates/v1_9_patch.b64 | base64 --decode | tar -xJf -
          python3 updates/compact_hud_1_9.py
          python3 updates/smoke_hud_1_9.py
          node --check site/src/game.js
          node --check site/src/freeweapons.js
          node --check site/src/main.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build_requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r build_requirements.txt
      - name: Generate tank and track assets
        run: python build_assets.py
      - name: Add mechanical detail to all nine tanks
        run: python updates/detail_models_1_2.py
      - name: Fix GLB muzzle and medal hotkeys 1.10
        shell: bash
        run: |
          base64 --decode updates/repair_combat_1_10.b64 | xz --decompress > updates/repair_combat_1_10.py
          python updates/repair_combat_1_10.py site
          cp updates/smoke_1_10.mjs site/tests/smoke_1_10.mjs
          node --check site/src/renderer.js
          node --check site/src/combat.js
          node --check site/src/game.js
          node --check site/src/freeweapons.js
          node --check site/src/main.js
          node site/tests/smoke_mechanics.mjs
          node site/tests/smoke_1_10.mjs
      - name: Install rival classes and player selection 1.11
        shell: bash
        run: |
          base64 --decode updates/v1_11_patch.b64 | tar -xJf -
          cp updates/pregame_1_11.js site/src/pregame.js
          cp updates/smoke_pregame_1_11.mjs site/tests/smoke_pregame_1_11.mjs
          cp updates/CHANGELOG_1_11_RU.md site/CHANGELOG_1_11_RU.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          s=p.read_text(encoding='utf-8')
          assert "version:'1.10.0'" in s
          s=s.replace("version:'1.10.0'","version:'1.11.0'",1)
          s=s.replace('DESERT CIRCUIT / 1.10','DESERT CIRCUIT / 1.11',1)
          p.write_text(s,encoding='utf-8')
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          assert './src/main.js?v=1.10' in s
          s=s.replace('./src/main.js?v=1.10','./src/main.js?v=1.11',1)
          s=s.replace('./src/style.css?v=1.10','./src/style.css?v=1.11',1)
          s=s.replace('STEEL RUSH 1.10 — Fixed Medals &amp; Muzzle Fire','STEEL RUSH 1.11 — Выбор танков и состав соперников',1)
          p.write_text(s,encoding='utf-8')
          Path('site/VERSION.txt').write_text('1.11.0 - Player tank selection / repeatable class-locked opponents\\n',encoding='utf-8')
          PY
          node --check site/src/pregame.js
          node --check site/src/main.js
          node site/tests/smoke_pregame_1_11.mjs
          node site/tests/smoke_1_10.mjs
          node site/tests/smoke_startflow_1_8.mjs
      - name: Verify release assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('site/assets')
          assert len(list((root/'tanks').glob('*.glb'))) == 9
          assert len(list((root/'previews').glob('*.png'))) == 9
          assert len(list((root/'tracks/01_desert').glob('*.glb'))) == 4
          assert (root/'tracks/01_desert/track01_runtime.json').is_file()
          assert Path('site/index.html').is_file()
          import trimesh
          for path in (root/'tanks').glob('*.glb'):
           scene=trimesh.load(path,file_type='glb',force='scene')
           assert any(n.startswith('SR12_TurretYaw_') for n in scene.graph.nodes_geometry),path
          print('All 9 detailed tank assets, track and previews generated')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
