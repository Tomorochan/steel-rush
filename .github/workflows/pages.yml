name: Publish STEEL RUSH
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source project
        shell: bash
        run: |
          cat bundle/part_*.b64 | base64 --decode | tar -xJf -
          test -f build_assets.py
          test -f site/index.html
      - name: Apply 1.0 gameplay and interface patch
        shell: bash
        run: |
          cat updates/v1_0_part_*.b64 | base64 --decode | tar -xJf -
          printf '{"type":"module"}\n' > site/package.json
          node --version
          node site/tests/smoke_mechanics.mjs
      - name: Install 3D Tank Showroom 1.1
        shell: bash
        run: |
          cp updates/showroom.js site/src/showroom.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/src/main.js')
          src = p.read_text()
          assert "import {Game} from './game.js';" in src
          assert 'g.start();console.info' in src
          src = src.replace("import {Game} from './game.js';", "import {Game} from './game.js';\nimport {installShowroom} from './showroom.js';", 1)
          src = src.replace('g.start();console.info', 'installShowroom(g);g.start();console.info', 1)
          src = src.replace("version:'1.0.0'", "version:'1.1.0'")
          p.write_text(src)
          PY
          node --check site/src/showroom.js
          node --check site/src/main.js
      - name: Install race and practice modes 1.2
        shell: bash
        run: |
          cp updates/modes_1_2.js site/src/modes.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          src=p.read_text()
          assert "import {installShowroom} from './showroom.js';" in src
          assert 'installShowroom(g);g.start();console.info' in src
          src=src.replace("import {installShowroom} from './showroom.js';","import {installShowroom} from './showroom.js';\nimport {installModes} from './modes.js';",1)
          src=src.replace('installShowroom(g);g.start();console.info','installShowroom(g);installModes(g);g.start();console.info',1)
          src=src.replace("version:'1.1.0'","version:'1.2.0'")
          p.write_text(src)
          PY
          node --check site/src/modes.js
          node --check site/src/main.js
      - name: Install pre-race briefing 1.3
        shell: bash
        run: |
          cat updates/v1_3_part_*.b64 | base64 --decode | tar -xJf -
          node --check site/src/pregame.js
          node site/tests/smoke_pregame.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/src/main.js')
          src=p.read_text()
          assert "import {installModes} from './modes.js';" in src
          assert 'installShowroom(g);installModes(g);g.start();console.info' in src
          src=src.replace("import {installModes} from './modes.js';", "import {installModes} from './modes.js';\nimport {installPregame} from './pregame.js';",1)
          src=src.replace('installShowroom(g);installModes(g);g.start();console.info', 'installShowroom(g);installModes(g);installPregame(g);g.start();console.info',1)
          src=src.replace("version:'1.2.0'", "version:'1.3.0'",1)
          p.write_text(src)
          PY
          node --check site/src/main.js
      - name: Install cinematic start and fix unintended medal firing 1.4
        shell: bash
        run: |
          cp updates/intro_1_4.js site/src/intro.js
          cp updates/smoke_intro_1_4.mjs site/tests/smoke_intro_1_4.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/src/game.js')
          src=p.read_text(encoding='utf-8')
          old="window.addEventListener('mousedown',e=>{if((e.button===0||e.button===2)&&this.mode==='race'&&!e.target.closest?.('.power-slot'))this.combat?.useSelected(e.button===2);});"
          new="this.canvas.addEventListener('mousedown',e=>{if((e.button===0||e.button===2)&&this.mode==='race'&&this.combat?.inventory?.length)this.combat.useSelected(e.button===2);});"
          assert old in src, 'Expected old global firing handler'
          p.write_text(src.replace(old,new,1),encoding='utf-8')
          p=Path('site/src/main.js')
          src=p.read_text(encoding='utf-8')
          assert "import {installPregame} from './pregame.js';" in src
          assert 'installShowroom(g);installModes(g);installPregame(g);g.start();console.info' in src
          src=src.replace("import {installPregame} from './pregame.js';","import {installPregame} from './pregame.js';\nimport {installIntro} from './intro.js';",1)
          src=src.replace('installShowroom(g);installModes(g);installPregame(g);g.start();console.info',
                          'installShowroom(g);installModes(g);installPregame(g);installIntro(g);g.start();console.info',1)
          src=src.replace("version:'1.3.0'","version:'1.4.0'",1)
          p.write_text(src,encoding='utf-8')
          p=Path('site/index.html')
          src=p.read_text(encoding='utf-8')
          src,n=re.subn(r'(./src/main[.]js[?]v=)[0-9.]+',r'\g<1>1.4',src)
          assert n==1, 'Expected exactly one JS cache-buster'
          p.write_text(src,encoding='utf-8')
          PY
          node --check site/src/intro.js
          node --check site/src/game.js
          node --check site/src/main.js
          node site/tests/smoke_intro_1_4.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build_requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r build_requirements.txt
      - name: Generate tank and track assets
        run: python build_assets.py
      - name: Add mechanical detail to all nine tanks
        run: python updates/detail_models_1_2.py
      - name: Verify release assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('site/assets')
          assert len(list((root/'tanks').glob('*.glb'))) == 9
          assert len(list((root/'previews').glob('*.png'))) == 9
          assert len(list((root/'tracks/01_desert').glob('*.glb'))) == 4
          assert (root/'tracks/01_desert/track01_runtime.json').is_file()
          assert Path('site/index.html').is_file()
          import trimesh
          for path in (root/'tanks').glob('*.glb'):
           scene=trimesh.load(path,file_type='glb',force='scene')
           assert any(n.startswith('SR12_TurretYaw_') for n in scene.graph.nodes_geometry),path
          print('All 9 detailed tank assets, track and previews generated')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
