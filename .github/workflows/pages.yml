name: Publish STEEL RUSH
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source project
        shell: bash
        run: |
          cat bundle/part_*.b64 | base64 --decode | tar -xJf -
          test -f build_assets.py
          test -f site/index.html
      - name: Apply 1.0 gameplay and interface patch
        shell: bash
        run: |
          cat updates/v1_0_part_*.b64 | base64 --decode | tar -xJf -
          printf '{"type":"module"}\n' > site/package.json
          node --version
          node site/tests/smoke_mechanics.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build_requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r build_requirements.txt
      - name: Generate tank and track assets
        run: python build_assets.py
      - name: Verify release assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('site/assets')
          assert len(list((root/'tanks').glob('*.glb'))) == 9
          assert len(list((root/'previews').glob('*.png'))) == 9
          assert len(list((root/'tracks/01_desert').glob('*.glb'))) == 4
          assert (root/'tracks/01_desert/track01_runtime.json').is_file()
          assert Path('site/index.html').is_file()
          print('All release assets generated')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
